[workspace]
resolver = "2"
members = ["crates/sf-cli", "crates/sf-draw", "crates/sf-gif", "crates/sf-settings", "crates/sf-media", "crates/sf-net", "crates/sf-edit", "crates/sf-capture", "crates/sf-overlay"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
