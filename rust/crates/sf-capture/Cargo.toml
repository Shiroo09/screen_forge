[package]
name = "sf-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Key labels, reserved-hotkey lookup and input overlay drawing (Rust port of ScreenForge.Gif.Input and ScreenForge.Hotkeys pure logic)"

[dependencies]
sf-settings = { path = "../sf-settings" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
