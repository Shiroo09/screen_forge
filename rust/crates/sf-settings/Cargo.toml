[package]
name = "sf-settings"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Application settings model, normalize rules and atomic persistence (Rust port of ScreenForge.Settings)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Registry"] }
