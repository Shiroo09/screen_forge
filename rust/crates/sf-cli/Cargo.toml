[package]
name = "sf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Minimal ScreenForge CLI: capture the screen, encode PNG or an animated GIF"

[[bin]]
name = "screenforge"
path = "src/main.rs"

[dependencies]
sf-gif = { path = "../sf-gif" }
sf-capture = { path = "../sf-capture" }
sf-edit = { path = "../sf-edit" }
sf-draw = { path = "../sf-draw" }
sf-settings = { path = "../sf-settings" }

png = "0.17"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
] }

[dev-dependencies]
gif = "0.13"
